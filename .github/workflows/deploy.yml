name: pages build and deployment

on:
  push:
    branches: [ main ] # 触发分支，你改成了main，这里没问题

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取你的代码到运行环境
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 配置Node.js环境（适配Vue项目）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18 # 用你项目兼容的Node版本，16/18/20都可以
          cache: 'npm'

      # 3. 安装依赖并构建项目
      - name: Install dependencies and build
        run: |
          npm install
          npm run build

      # 4. 上传构建产物（dist文件夹）
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # Vue项目默认构建输出目录，不要改！

  # 部署到GitHub Pages的任务
  deploy:
    needs: build # 必须等build任务完成才执行
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
